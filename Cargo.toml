[workspace]
resolver = "2"
default-members = ["crates/core", "crates/runtime", "crates/assets", "crates/gui", "tools/cli"]
members = [
    "crates/core",
    "crates/runtime",
    "crates/assets",
    "crates/py",
    "crates/gui",
    "tools/cli",
]

[workspace.dependencies]
pyo3 = { version = "0.29.3", default-features = false }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
# Optimize for runtime performance with smaller binaries; longer compile times and reduced backtraces.
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 1

[profile.python]
inherits = "release"
panic = "unwind"

# Build desktop executables separately from workspace tests/Python bindings.
[profile.desktop]
inherits = "release"
opt-level = "s"
debug = 0
