[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "visual_novel_engine"
version = "0.1.0"
description = "A visual novel engine with Python bindings"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.maturin]
module-name = "visual_novel_engine"
manifest-path = "crates/py/Cargo.toml"
features = ["extension-module"]

[tool.ruff]
extend-exclude = [".pytest_cache", "pytest-cache-files-*", "target"]

[tool.ruff.lint]
# Preserve Python 3.8 annotations, including runtime inspection of public types.
ignore = ["UP006", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
# Public validation errors intentionally remain ValueError for API compatibility.
"python/vnengine/builder.py" = ["TRY004"]
"python/vnengine/script_types.py" = ["TRY004"]
"python/vnengine/types.py" = ["TRY004"]
# Legacy stub aliases do not require a typing_extensions dependency.
"python/visual_novel_engine.pyi" = ["PYI026"]

[tool.mypy]
files = ["python", "tests/python", "examples/python"]
mypy_path = "python"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
norecursedirs = [".pytest_cache", "target"]
pythonpath = ["python"]
